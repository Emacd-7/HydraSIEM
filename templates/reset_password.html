<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Project Hydra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto Mono', monospace;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }

        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.1);
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(56, 189, 248, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% {
                bottom: 100%;
            }

            100% {
                bottom: -100px;
            }
        }

        .input-cyber {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            color: #38bdf8;
            transition: all 0.3s ease;
        }

        .input-cyber:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            outline: none;
        }

        .btn-cyber {
            background: linear-gradient(45deg, #0ea5e9, #38bdf8);
            color: #0f172a;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-cyber:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        .btn-cyber::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-cyber:hover::before {
            left: 100%;
        }
    </style>
</head>

<body class="h-screen w-full flex items-center justify-center relative">

    <!-- Background Grid -->
    <div class="absolute inset-0 z-0 opacity-20"
        style="background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); background-size: 40px 40px;">
    </div>

    <div class="scanline"></div>

    <div class="relative z-10 w-full max-w-md p-8 rounded-xl glass-panel">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold cyber-font text-sky-400 mb-2">HYDRA<span class="text-white">SIEM</span></h1>
            <p class="text-slate-400 text-sm tracking-widest">RESET ACCESS KEY</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="mb-6 p-3 bg-red-900/30 border border-red-500/50 rounded text-red-300 text-sm text-center">
            {% for message in messages %}
            {{ message }}
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="/reset-password/{{ token }}" method="POST" class="space-y-6">
            <div>
                <label for="password" class="block text-xs uppercase tracking-wider text-slate-400 mb-2">New Access
                    Key</label>
                <input type="password" name="password" id="password" required minlength="4"
                    class="w-full px-4 py-3 rounded input-cyber placeholder-slate-600" placeholder="Enter new password">
            </div>

            <div>
                <label for="confirm_password" class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Confirm
                    Access Key</label>
                <input type="password" name="confirm_password" id="confirm_password" required minlength="4"
                    class="w-full px-4 py-3 rounded input-cyber placeholder-slate-600"
                    placeholder="Confirm new password">
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full py-3 rounded btn-cyber cyber-font">
                    Set New Access Key
                </button>
            </div>
        </form>

        <div class="mt-8 text-center text-xs text-slate-600">
            <a href="/login" class="text-sky-500 hover:text-sky-300 transition-colors">Return to Login Terminal</a>
        </div>
    </div>

</body>

</html>
